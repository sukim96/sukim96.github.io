name: Deploy Pages

# main 또는 dev에 푸시되면 main(루트) + dev(/dev)를 합쳐서 배포
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: site/dev

      - name: Clean internal files
        run: rm -rf site/.git site/.github site/dev/.git site/dev/.github

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
